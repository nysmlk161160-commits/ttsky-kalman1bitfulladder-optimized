name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@395eedb3eeec3c2f4961c3b04ff2cf87f5525636
        with:
          pdk: sky130A
          tools-ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f

      - name: Verify the final clock, timing and electrical constraints
        run: python flow/verify_clock_fanout.py

      - name: Preserve clock-fanout acceptance record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: version30-physical-acceptance
          path: runs/wokwi/fanout_acceptance.json
          if-no-files-found: warn

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

      - name: Archive version30 GL case records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: version30-gl-case-records
          path: test/output/*.json
          if-no-files-found: warn

  viewer:
    # Experimental branches must never replace the repository's existing Pages.
    if: github.ref == 'refs/heads/main'
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
